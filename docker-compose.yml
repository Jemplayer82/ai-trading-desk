services:
  # Interactive CLI — use via Portainer console attach.
  tradingagents:
    image: ghcr.io/jemplayer82/tradingagents:latest
    pull_policy: always
    environment:
      LLM_PROVIDER: ollama
      TRADINGAGENTS_LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      SCHWAB_MCP_URL: ${SCHWAB_MCP_URL:-http://192.168.7.50:3105/mcp}
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    tty: true
    stdin_open: true
    # Interactive-only container (waits at the ticker-symbol prompt for a
    # human via `docker attach`); with no restart policy it stays exited
    # after the idle session is reaped, showing as permanently "down" in
    # Portainer even though nothing crashed. unless-stopped brings it back
    # to the idle prompt so it doesn't read as a dead service.
    restart: unless-stopped

  # Single-ticker analysis backend + Schwab OAuth.
  tradingagents-api:
    image: ghcr.io/jemplayer82/tradingagents:latest
    pull_policy: always
    entrypoint: ["uvicorn", "web.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TIER: ${TIER:-1}
      LLM_PROVIDER: ollama
      TRADINGAGENTS_LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      SCHWAB_MCP_URL: ${SCHWAB_MCP_URL:-http://192.168.7.50:3105/mcp}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      SWITCHBOARD_URL: http://switchboard:3107
      SWITCHBOARD_MCP_TOKEN: ${SWITCHBOARD_MCP_TOKEN}
      SWITCHBOARD_TARGET_AGENT: ${SWITCHBOARD_TARGET_AGENT:-llm-router}
      SWITCHBOARD_PROVIDER: ${SWITCHBOARD_PROVIDER:-}
      BUS_MIRROR: ${BUS_MIRROR:-analysis}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    restart: unless-stopped
    depends_on:
      - switchboard


  # Cron daemon — fires nightly scan + 5am newsletter + hourly token health.
  tradingagents-scheduler:
    image: ghcr.io/jemplayer82/tradingagents:latest
    pull_policy: always
    entrypoint: ["python", "-m", "web.scheduler"]
    environment:
      TIER: ${TIER:-1}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      FRED_NOTIFY_URL: ${FRED_NOTIFY_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      NEWSLETTER_FROM: ${NEWSLETTER_FROM}
      NEWSLETTER_TO: ${NEWSLETTER_TO}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:8080}
      SCHEDULER_TIMEZONE: America/New_York
      TRADINGAGENTS_API_URL: http://tradingagents-api:8000
      TRADINGAGENTS_PORTFOLIO_URL: http://tradingagents-portfolio:8000
      # Switchboard access for the in-process LLM jobs (outcome_sweep 23:30,
      # options_grade 20:15). Without these, create_llm_client('switchboard')
      # constructs fine but every invoke raises — the sweep's reflections were
      # silently degrading to canned-only per entry. Mirrors the portfolio
      # service's block above.
      SWITCHBOARD_URL: http://switchboard:3107
      SWITCHBOARD_MCP_TOKEN: ${SWITCHBOARD_MCP_TOKEN}
      SWITCHBOARD_TARGET_AGENT: ${SWITCHBOARD_TARGET_AGENT:-llm-router}
      SWITCHBOARD_PROVIDER: ${SWITCHBOARD_PROVIDER:-}
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    restart: unless-stopped
    depends_on:
      - tradingagents-api

  # Pure nginx frontend — no secrets, just static files + reverse proxy.
  tradingagents-web:
    image: ghcr.io/jemplayer82/tradingagents-web:latest
    pull_policy: always
    ports:
      - "${WEB_PORT:-8080}:8000"
    restart: unless-stopped
    depends_on:
      - tradingagents-api

  # Agent message bus — the dashboard streams it via /api/bus, AND it's exposed
  # on host port 3109 so an external Claude CLI (or other off-stack agent) can
  # reach it at http://<host>:3109/mcp. The SWITCHBOARD_MCP_TOKEN bearer is the
  # ONLY gate on that port — keep it strong; do not public-proxy without TLS.
  switchboard:
    image: ghcr.io/jemplayer82/mcp-switchboard:latest
    environment:
      PORT: "3107"
      SWITCHBOARD_MCP_TOKEN: ${SWITCHBOARD_MCP_TOKEN:?SWITCHBOARD_MCP_TOKEN required}
      SWITCHBOARD_DB_PATH: /data/switchboard.db
    ports:
      - "${BUS_PORT:-3109}:3107"   # external bus access (3109 host-side default: 3107/3108 used by mcp-shared)
    volumes:
      - switchboard_data:/data
    restart: unless-stopped

  # LLM router — registers on the bus as the target agent and bridges
  # llm_request DMs to Ollama / OpenAI-compatible backends. Same image,
  # different entrypoint. Required for LLM_PROVIDER=switchboard with a
  # non-Claude backend. Claude requests go directly to the Cleo daemon
  # (scripts/cleo_llm_handler.py, bus agent "cleo"), NOT through this router.
  tradingagents-llm-router:
    image: ghcr.io/jemplayer82/tradingagents:latest
    pull_policy: always
    entrypoint: ["python", "-m", "tradingagents.llm_router"]
    environment:
      SWITCHBOARD_URL: http://switchboard:3107
      SWITCHBOARD_MCP_TOKEN: ${SWITCHBOARD_MCP_TOKEN}
      SWITCHBOARD_AGENT_ID: llm-router
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_ROUTER_CONCURRENCY: ${LLM_ROUTER_CONCURRENCY:-8}
    restart: unless-stopped
    depends_on:
      - switchboard

  # CPU-only local Ollama — experiment for the quick-scan role (no tool
  # calling needed there, unlike deep). No GPU device mapping: WebServer has
  # none, this runs on spare EPYC cores. mem_limit bounded so a bad model
  # choice can't reintroduce the OOM crisis this host just recovered from
  # (see [[webserver-host-ram-constraint]]). Does NOT touch the live
  # quick_provider preference — point a test run at
  # http://tradingagents-ollama:11434 explicitly before switching over.
  # Model persisted in a named volume so a redeploy doesn't re-pull it.
  tradingagents-ollama:
    image: ollama/ollama:latest
    pull_policy: always
    mem_limit: 4g
    ports:
      - "11435:11434"   # host-side debug/pull access
    volumes:
      - tradingagents_ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  tradingagents_data:
  switchboard_data:
  tradingagents_ollama_data:
